# Safe full review (sticky PR comment + SARIF code scanning) on fork PRs.
#
# Safe because:
#  - action runs from github.action_path on the base branch, never executing untrusted PR scripts;
#  - checks out the PR head SHA into `pr/`, not the workspace root, with history for merge-base;
#  - ctxcap only reads files in that checkout as regular data.
name: ctxcap
on: pull_request_target
jobs:
  ctxcap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
      - uses: Naeha-S/ctxcap@v1
        with:
          path: pr
          fail-on: increase
