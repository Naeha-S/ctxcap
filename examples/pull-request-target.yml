# Safe full review (sticky PR comment + SARIF code scanning) on fork PRs.
#
# Safe because:
#  - action runs from github.action_path on the base branch, never executing untrusted PR scripts;
#  - checks out PR head SHA with fetch-depth: 0 so merge-base can be resolved;
#  - ctxlint only reads files in the checkout as regular data.
name: ctxlint
on: pull_request_target
jobs:
  ctxlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: Naeha-S/ctxlint@v0.1.0
        with:
          fail-on: increase
