# Token budget for the context files, checked on every pull request.
# Compares against ctxcap-baseline.json, so the first run is the baseline and
# later runs report the change. Nothing is installed and no key is needed.
name: ctxcap
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  ctxcap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: Naeha-S/ctxcap@v1
        with: { fail-on: increase }
