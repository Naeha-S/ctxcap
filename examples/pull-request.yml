# Same-repo PRs. Fork PRs still get annotations + job summary (read-only token).
name: ctxlint
on: pull_request
permissions:
  contents: read
  pull-requests: write
  security-events: write   # SARIF upload; drop if you set upload-sarif: false
jobs:
  ctxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: Naeha-S/ctxlint@v0.1.0
        with: { fail-on: increase }
