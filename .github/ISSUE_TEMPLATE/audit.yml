name: Audit my repository
description: Send a repository and get a before/after of its context files published, with the lines that changed.
title: "Audit: "
labels: ["audit"]
body:
  - type: markdown
    attributes:
      value: |
        The audit series is time-boxed to ten. Each one publishes the token count
        before and after, the exact edits, and the `ctxcap` output that proves it.
        Nothing is changed in your repository without a pull request you approve.
  - type: input
    id: repository
    attributes:
      label: Repository
      description: The public repository to audit.
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: dropdown
    id: permission
    attributes:
      label: How should the result be published?
      options:
        - With the repository named and linked
        - With the repository anonymised ("a 40k-star Go project")
        - Do not publish; send the report to me only
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What is the context budget for?
      description: A rough target, a specific file that has grown, or a rule that must survive the trim.
      placeholder: AGENTS.md is 6,000 tokens and the team wants it under 2,000 without losing the release process.
  - type: checkboxes
    id: consent
    attributes:
      label: Confirmation
      options:
        - label: I maintain this repository or have permission to request an audit of it.
          required: true
        - label: I understand the report will be generated by `ctxcap` and reviewed by a person before it is published.
          required: true
