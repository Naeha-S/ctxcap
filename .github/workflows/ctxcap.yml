name: ctxcap
on: pull_request
permissions:
  contents: read
  pull-requests: write
  security-events: write
jobs:
  ctxcap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./
        with: { fail-on: budget, upload-sarif: false }
