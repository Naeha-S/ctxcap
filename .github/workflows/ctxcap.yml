name: ctxcap
on: pull_request
permissions:
  contents: read
  pull-requests: write
  security-events: write
jobs:
  ctxcap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: Naeha-S/ctxcap@v1.2.1
        with: { fail-on: increase }
