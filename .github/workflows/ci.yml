name: ci
on: [push, pull_request]
jobs:
  test:
    # Windows too: its git checks out with core.autocrlf=true, and a release
    # was once held up by tests that only failed there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test
      - run: node src/index.js --json
