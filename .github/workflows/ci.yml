name: ci
on: [push, pull_request]
jobs:
  test:
    # Windows too: its git checks out with core.autocrlf=true, and a release
    # was once held up by tests that only failed there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - run: node src/index.js --json

  minimum-node:
    # Keep the declared >=20 engine range honest at its lower bound.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.0.0
      - run: npm ci
      - run: node src/index.js --json
